<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Moje tréninky</title>
<style>
:root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --border: rgba(11,11,11,0.12); --accent: #2a78d6; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --border: rgba(255,255,255,0.12); --accent: #3987e5; --bad: #e66767; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; display: grid; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
p { margin: 0; color: var(--ink2); font-size: 14px; }
input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--ink); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.remember { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink2); }
button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--ink); color: var(--surface); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--bad); font-size: 13.5px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f">
  <h1>Moje tréninky</h1>
  <p>Dashboard je zašifrovaný. Zadej heslo.</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Heslo" required autofocus>
  <label class="remember"><input type="checkbox" id="rem"> Zapamatovat na tomto zařízení</label>
  <button id="go">Odemknout</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = "garmin-key-" + BOX.salt;
async function open(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BOX.iv) }, key, b64(BOX.ct));
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(BOX.salt), iterations: BOX.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (!saved) return;
  try { await open(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"])); }
  catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Odemykám…"; err.textContent = "";
  try {
    const key = await derive(document.getElementById("pw").value);
    if (document.getElementById("rem").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e) {}
    }
    await open(key);
  } catch (e) {
    err.textContent = "Heslo nesedí. Zkus to znovu.";
    go.disabled = false; go.textContent = "Odemknout";
  }
});
